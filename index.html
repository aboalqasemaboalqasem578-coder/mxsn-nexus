<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#22d3ee"><link rel="manifest" href="manifest.json"><link rel="stylesheet" href="style.css"><title>MXSN Nexus</title></head><body><header><div class="brand"><b>MX</b><div><h1 id="storeName">MXSN Nexus</h1><p id="storeTag">متجر المنتجات الرقمية</p></div></div><input id="search" placeholder="ابحث عن منتج..."><button class="secondary" onclick="openTrack()">متابعة الطلب</button></header><main><section class="hero"><h2 id="storeTitle">MXSN Nexus</h2><p id="storeDescription"></p></section><section><div class="section-head"><h2>المنتجات</h2><span id="count"></span></div><div id="products" class="grid"></div></section></main><footer>© <span id="year"></span> MXSN Nexus</footer><div id="buyModal" class="modal hidden"><div class="modal-card"><button class="close" onclick="closeBuy()">×</button><h2>شراء المنتج</h2><div id="buyProduct"></div><div class="note" id="paymentInfo"></div><label>اسمك (اختياري)</label><input id="customerName" placeholder="الاسم"><label>رقم هاتف/وسيلة تواصل (اختياري)</label><input id="customerContact" placeholder="وسيلة التواصل"><label>رقم/معرّف التحويل</label><input id="transferId" placeholder="أدخل رقم التحويل"><label>قيمة المبلغ</label><input id="amount" type="number" min="0" step="0.01"><button class="primary" onclick="submitOrder()">إرسال طلب الشراء</button><div id="buyMsg" class="msg"></div></div></div><div id="trackModal" class="modal hidden"><div class="modal-card"><button class="close" onclick="closeTrack()">×</button><h2>متابعة الطلب</h2><input id="orderIdInput" placeholder="رقم الطلب"><button class="secondary full" onclick="trackOrder()">متابعة</button><div id="trackMsg" class="msg"></div></div></div><script src="app.js"></script></body></html>
